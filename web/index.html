<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NIST Evidence Desk</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="frame masthead-inner">
      <span class="brand">NIST Evidence Desk</span>
      <span class="collection">AI RMF 1.0 <span aria-hidden="true">/</span> Generative AI Profile</span>
    </div>
  </header>
  <main class="frame">
    <section class="intro">
      <h1>Ask the NIST reports</h1>
      <p>Find an answer and read the passage it cites.</p>
    </section>
    <form id="question-form" class="query">
      <label for="question">Your question</label>
      <textarea id="question" rows="2" maxlength="600" required placeholder="When should AI systems be tested?"></textarea>
      <div class="query-actions">
        <div class="mode">
          <label for="mode">Answer mode</label>
          <select id="mode">
            <option value="extractive">Quote from the report</option>
            <option value="qwen">Generate with local Qwen</option>
          </select>
        </div>
        <button id="submit" type="submit">Ask question <span aria-hidden="true">→</span></button>
      </div>
    </form>
    <div class="examples" aria-label="Example questions">
      <span>Try a question</span>
      <button type="button">When does the AI RMF say AI systems should be tested?</button>
      <button type="button">For action GV-1.1-001, which legal areas does NIST specifically mention?</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <section class="results" id="results" hidden aria-label="Question results">
      <article class="card">
        <h2>Answer</h2>
        <p id="answer"></p>
      </article>
      <aside class="card sources">
        <h2>Source passages</h2>
        <div id="source-list"></div>
      </aside>
    </section>
  </main>
</body>
</html>
